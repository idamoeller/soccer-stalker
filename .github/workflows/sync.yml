name: Sync scores

on:
  schedule:
    - cron: "*/10 * * * *"    # every 10 minutes (UTC); adjust as you like
  workflow_dispatch:           # lets you run it on demand from the Actions tab

# Don't pile up overlapping runs
concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Run poller
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          # Manual "Run workflow" always does a full pull; scheduled runs decide
          # for themselves (poller.should_sync) whether a game is near.
          FORCE_SYNC: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python poller.py
