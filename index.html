<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soccer Stalker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Display&family=Work+Sans:wght@300..700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#faf8f4; --ink:#1c1a17; --ink-2:#5c574d; --muted:#78726a; --faint:#a09a8e;
    --rule:#e7e2d8; --field:#c9c2b4; --accent:#2f5d45; --accent-soft:#b9cdc2;
    --win:#2f7d4f; --loss:#b23a3a; --draw:#a97613; --white:#fffdfa;
    --serif:'Libre Caslon Display',Georgia,'Times New Roman',serif;
    --sans:'Work Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
    font-weight:400;-webkit-font-smoothing:antialiased;min-height:100vh;}
  button{font-family:var(--sans);cursor:pointer;}
  input{font-family:inherit;}
  [hidden]{display:none!important;}

  .wrap{max-width:560px;margin:0 auto;padding:38px 22px 80px;}
  .authwrap{max-width:392px;margin:0 auto;padding:14vh 22px 60px;}
  /* On a wider screen (tablet/desktop) let the schedule breathe. Mobile keeps
     the narrow 560px column; this only kicks in above 760px viewport width. */
  @media (min-width: 760px){
    .wrap{max-width:900px;padding-left:34px;padding-right:34px;}
  }

  /* headline */
  .brand{font-family:var(--serif);font-size:36px;font-weight:400;line-height:1;letter-spacing:-.01em;margin:0;}
  .brand .ball{font-size:.66em;margin-right:.12em;}
  .kicker{font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.18em;
    text-transform:uppercase;color:var(--muted);margin:12px 0 0;}

  /* user bar */
  .userbar{display:flex;align-items:baseline;justify-content:space-between;gap:12px;
    margin:8px 0 34px;padding-top:14px;border-top:1px solid var(--rule);}
  .who{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:lowercase;color:var(--faint);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  /* section */
  section{margin-top:36px;}
  .sechead{padding-bottom:9px;border-bottom:1px solid var(--ink);font-family:var(--mono);
    font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--ink);}

  /* fields */
  .field{display:block;margin-top:20px;}
  .field > span{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--muted);margin-bottom:3px;}
  .field input{width:100%;background:transparent;border:0;border-bottom:1px solid var(--field);
    padding:7px 2px 9px;font-family:var(--sans);font-size:15.5px;color:var(--ink);outline:none;}
  .field input:focus{border-bottom-color:var(--ink);}
  .field input::placeholder{color:var(--faint);}
  .field select{width:100%;background:transparent;border:0;border-bottom:1px solid var(--field);
    padding:7px 2px 9px;font-family:var(--sans);font-size:15.5px;color:var(--ink);outline:none;-webkit-appearance:none;appearance:none;}
  .field select:focus{border-bottom-color:var(--ink);}
  .field select:disabled{color:var(--faint);opacity:.7;}
  .modetabs{display:inline-flex;border:1px solid var(--field);border-radius:2px;overflow:hidden;margin:0 0 6px;}
  .modetabs button{background:none;padding:7px 14px;font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);cursor:pointer;}
  .modetabs button.on{background:var(--ink);color:var(--paper);}
  .modetabs button+button{border-left:1px solid var(--field);}

  /* buttons */
  .primary{display:block;width:100%;margin-top:26px;background:var(--ink);color:var(--paper);
    border:1px solid var(--ink);border-radius:2px;padding:14px 24px;font-size:12px;font-weight:500;
    letter-spacing:.16em;text-transform:uppercase;transition:background .12s,color .12s;}
  .primary:hover{background:transparent;color:var(--ink);}
  .primary:disabled{opacity:.45;cursor:default;}
  .underbtn{background:none;border:0;padding:0 0 2px;font-family:var(--mono);font-size:10px;
    font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);
    border-bottom:1px solid var(--accent-soft);cursor:pointer;}
  .underbtn:hover{border-bottom-color:var(--accent);}

  .msg{min-height:18px;margin-top:14px;font-family:var(--mono);font-size:11px;letter-spacing:.03em;color:var(--muted);}
  .msg.err{color:var(--loss);}
  .msg.ok{color:var(--accent);}

  .togglerow{margin-top:22px;font-family:var(--mono);font-size:10px;letter-spacing:.08em;
    text-transform:uppercase;color:var(--muted);display:flex;gap:8px;justify-content:center;}

  /* team rows */
  .team{display:flex;align-items:center;gap:14px;padding:15px 0;border-bottom:1px solid var(--rule);}
  .crest{width:34px;height:34px;flex:none;border-radius:2px;background:var(--white);border:1px solid var(--rule);
    object-fit:contain;display:flex;align-items:center;justify-content:center;font-size:17px;}
  .team .info{flex:1;min-width:0;}
  .team .name{font-size:16px;font-weight:500;letter-spacing:-.005em;color:var(--ink);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .team .tid{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-top:2px;}
  .xbtn{background:none;border:0;padding:2px 4px;font-family:var(--mono);font-size:9px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--faint);flex:none;cursor:pointer;}
  .xbtn:hover{color:var(--loss);}

  .empty{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--faint);padding:22px 0;text-align:center;line-height:1.7;}

  /* games */
  .teamgroup{margin-top:30px;padding-top:26px;border-top:2px solid var(--ink);}
  .teamgroup:first-child{margin-top:16px;padding-top:22px;border-top:2px solid var(--ink);}
  #games > .game:first-child{border-top:2px solid var(--ink);margin-top:16px;padding-top:16px;}  /* combined mode divider */
  .grouphd{display:flex;align-items:center;gap:11px;margin-bottom:12px;}
  .grouphd img{width:30px;height:30px;border-radius:3px;object-fit:contain;border:1px solid var(--rule);background:var(--white);}
  .grouphd .gname{font-family:var(--sans);font-size:19px;font-weight:600;letter-spacing:-.01em;color:var(--ink);line-height:1.15;}
  .game{display:block;padding:14px 0;border-bottom:1px solid var(--rule);text-decoration:none;color:inherit;}
  .game:hover .gevent{color:var(--accent);}
  .gevent{font-size:13px;font-weight:600;color:var(--ink-2);letter-spacing:.01em;margin-bottom:9px;}
  .scard{display:flex;flex-direction:column;gap:6px;}
  .tline{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .tside{display:flex;align-items:center;gap:9px;min-width:0;}
  .scard .crest{width:22px;height:22px;font-size:12px;}
  .tn{font-size:15px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .tline.mine .tn{color:var(--ink);font-weight:600;}
  .tsc{font-family:var(--mono);font-size:15px;font-weight:600;color:var(--muted);
    font-variant-numeric:tabular-nums;flex:none;min-width:14px;text-align:right;}
  .tsc.win{color:var(--win);} .tsc.loss{color:var(--loss);} .tsc.draw{color:var(--draw);}
  .game .when{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--faint);margin-top:10px;line-height:1.5;}

  /* compact (dense table) view */
  .grouphd .ghinfo{display:flex;flex-direction:column;gap:2px;min-width:0;}
  .grec{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);}
  .ctable{width:100%;border-collapse:collapse;margin-top:4px;}
  .ctable th{font-family:var(--mono);font-size:8px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;
    color:var(--faint);text-align:left;padding:0 7px 6px 0;border-bottom:1px solid var(--rule);white-space:nowrap;}
  .ctable td{padding:8px 7px 8px 0;border-bottom:1px solid var(--rule);vertical-align:top;}
  .ctable tr:last-child td{border-bottom:none;}
  .crow{cursor:pointer;}
  .crow:hover td{background:var(--white);}
  .c-date{font-family:var(--mono);font-size:10px;letter-spacing:.02em;color:var(--ink-2);white-space:nowrap;}
  .c-time{font-family:var(--mono);font-size:9px;letter-spacing:.02em;color:var(--muted);white-space:nowrap;margin-top:2px;}
  .c-opp{font-size:13px;font-weight:500;color:var(--ink);line-height:1.25;}
  .c-team{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:8.5px;letter-spacing:.08em;
    text-transform:uppercase;color:var(--muted);margin-bottom:3px;}
  .c-team img{width:13px;height:13px;border-radius:2px;object-fit:contain;border:1px solid var(--rule);background:var(--white);}
  .c-res{font-family:var(--mono);font-size:12.5px;font-weight:600;white-space:nowrap;text-align:right;
    font-variant-numeric:tabular-nums;color:var(--muted);}
  .c-res.win{color:var(--win);} .c-res.loss{color:var(--loss);} .c-res.draw{color:var(--draw);}
  .c-event{font-size:11px;color:var(--ink-2);line-height:1.3;}
  .c-event .cdiv{font-family:var(--mono);font-size:8px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin-top:2px;}

  /* view controls */
  .controls{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 16px;margin:16px 0 2px;}
  .seg{display:inline-flex;border:1px solid var(--field);border-radius:2px;overflow:hidden;}
  .seg button{background:none;padding:7px 13px;font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);}
  .seg button.on{background:var(--ink);color:var(--paper);}
  .seg button+button{border-left:1px solid var(--field);}
  .chips{display:inline-flex;gap:7px;flex-wrap:wrap;}
  .chips button{background:var(--white);border:1px solid var(--field);border-radius:2px;padding:7px 11px;
    font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);}
  .chips button.on{background:var(--ink);border-color:var(--ink);color:var(--paper);}
  .gteam{display:flex;align-items:center;gap:7px;margin-bottom:3px;font-family:var(--mono);font-size:9px;
    letter-spacing:.12em;text-transform:uppercase;color:var(--muted);}
  .gteam img{width:15px;height:15px;border-radius:2px;object-fit:contain;border:1px solid var(--rule);background:var(--white);}
  .gteam .ball{font-size:12px;}
  .recentpick{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin:12px 0 2px;
    font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);}
  .recentpick .rplabel{color:var(--faint);}
  .stepper{display:inline-flex;align-items:center;gap:8px;}
  .stepper button{width:22px;height:22px;flex:none;border:1px solid var(--field);border-radius:2px;background:var(--white);
    color:var(--ink);font-size:14px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .stepper button:hover{border-color:var(--ink);}
  .stepper b{font-weight:600;color:var(--ink);min-width:12px;text-align:center;font-size:11px;}
  .stepper .unit{color:var(--muted);}

  /* header actions + sync */
  .apphead{display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .appacts{display:flex;align-items:center;gap:16px;flex:none;}
  .synclink{background:none;border:0;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--accent);cursor:pointer;border-bottom:1px solid var(--accent-soft);padding:0 0 2px;}
  .synclink:hover{border-bottom-color:var(--accent);}
  .synclink:disabled{color:var(--muted);border-bottom-color:transparent;cursor:default;}
  .menubtn{background:none;border:0;font-size:22px;line-height:1;color:var(--ink);cursor:pointer;padding:2px 2px 0;}

  /* drawer menu */
  .backdrop{position:fixed;inset:0;background:rgba(28,26,23,.30);z-index:40;}
  .menu{position:fixed;top:0;right:0;bottom:0;width:min(90vw,392px);background:var(--paper);
    border-left:1px solid var(--rule);box-shadow:-12px 0 36px rgba(28,26,23,.13);z-index:50;
    display:flex;flex-direction:column;}
  .menuhead{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:18px 22px;border-bottom:1px solid var(--rule);}
  .menuhead .who{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--muted);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .menux{background:none;border:0;font-size:24px;line-height:1;color:var(--muted);cursor:pointer;padding:0 2px;}
  .menux:hover{color:var(--ink);}
  .menuscroll{flex:1;overflow-y:auto;padding:2px 22px 44px;}
  .ghostbtn{background:transparent;color:var(--ink);margin-top:30px;}
  .ghostbtn:hover{background:var(--ink);color:var(--paper);}

  /* inline team editing */
  .mini{background:none;border:0;padding:2px 4px;font-family:var(--mono);font-size:9px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--accent);cursor:pointer;flex:none;border-bottom:1px solid transparent;}
  .mini:hover{border-bottom-color:var(--accent);}
  .mini.cancel{color:var(--muted);}
  .editin{flex:1;min-width:0;background:transparent;border:0;border-bottom:1px solid var(--ink);
    font-family:var(--sans);font-size:16px;font-weight:500;color:var(--ink);padding:4px 0 6px;outline:none;}
  .linksel{font-size:13px;margin-top:3px;-webkit-appearance:none;appearance:none;cursor:pointer;}
  .drag{flex:none;cursor:grab;color:var(--faint);font-size:16px;line-height:1;padding:0 3px 0 0;
    touch-action:none;user-select:none;-webkit-user-select:none;}
  .drag:active{cursor:grabbing;}
  .sortable-ghost{opacity:.35;}
  .sortable-chosen .name{color:var(--accent);}

  /* gotSport name search */
  .gsrow{display:flex;gap:18px;}
  .gsrow .field{flex:1;min-width:0;}
  .gsresults{margin-top:10px;}
  .gsresults:empty{display:none;}
  .gshint{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--faint);padding:10px 0 2px;line-height:1.6;}
  .gsitem{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:none;border:0;
    border-bottom:1px solid var(--rule);padding:11px 2px;cursor:pointer;}
  .gsitem:hover{background:var(--white);}
  .gsitem:disabled{cursor:default;opacity:.55;}
  .gsitem .info{flex:1;min-width:0;}
  .gsitem .gn{font-size:15px;font-weight:500;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .gsitem .gm{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-top:2px;}
  .gsitem .plus{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);flex:none;}
  .gsitem:disabled .plus{color:var(--faint);}
  .gsfallback{margin-top:24px;}
  .gsfallback summary{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--muted);cursor:pointer;list-style:none;}
  .gsfallback summary::-webkit-details-marker{display:none;}
  .gsfallback summary::before{content:"+ ";color:var(--faint);}
  .gsfallback[open] summary::before{content:"– ";}

  /* team filter — excel-style dropdown */
  .teamfilter{position:relative;margin:14px 0 2px;}
  .teamfilter:empty{display:none;}
  .tfbtn{display:inline-flex;align-items:center;gap:8px;background:var(--white);border:1px solid var(--field);
    border-radius:2px;padding:8px 12px;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--ink-2);cursor:pointer;}
  .tfbtn:hover{border-color:var(--ink);}
  .tfbtn .tflabel{color:var(--faint);}
  .tfbtn .tfcaret{color:var(--muted);font-size:8px;margin-left:1px;}
  .tfpanel{position:absolute;z-index:30;top:calc(100% + 5px);left:0;min-width:232px;max-width:300px;
    background:var(--paper);border:1px solid var(--field);border-radius:3px;
    box-shadow:0 12px 32px rgba(28,26,23,.15);padding:10px;}
  .tfsearch{width:100%;background:transparent;border:0;border-bottom:1px solid var(--field);
    padding:5px 2px 7px;font-family:var(--sans);font-size:14px;color:var(--ink);outline:none;margin-bottom:6px;}
  .tfsearch:focus{border-bottom-color:var(--ink);}
  .tfquick{display:flex;gap:16px;padding:2px 2px 8px;border-bottom:1px solid var(--rule);margin-bottom:4px;}
  .tfquick button{background:none;border:0;padding:0;font-family:var(--mono);font-size:9px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--accent);cursor:pointer;}
  .tflist{max-height:244px;overflow-y:auto;}
  .tfopt{display:flex;align-items:center;gap:10px;padding:7px 2px;cursor:pointer;font-size:14px;color:var(--ink);}
  .tfopt input{flex:none;width:15px;height:15px;accent-color:var(--accent);}
  .tfopt span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .tfopt.nomatch{display:none;}
</style>
</head>
<body>

<!-- ============ AUTH (logged out) ============ -->
<div id="auth" class="authwrap" hidden>
  <h1 class="brand" style="text-align:center;"><span class="ball">⚽</span>Soccer Stalker</h1>
  <p class="kicker" style="text-align:center;">Follow a team · get every score</p>

  <section style="margin-top:40px;">
    <div class="sechead" id="authTitle">Sign in</div>
    <label class="field"><span>Email</span>
      <input id="email" type="email" autocomplete="email" placeholder="you@example.com"></label>
    <label class="field"><span>Password</span>
      <input id="password" type="password" autocomplete="current-password" placeholder="••••••••"></label>
    <button class="primary" id="authBtn">Sign in</button>
    <div id="authMsg" class="msg"></div>
    <div class="togglerow">
      <span id="toggleText">No account yet?</span>
      <button class="underbtn" id="toggleMode">Create one</button>
    </div>
  </section>
</div>

<!-- ============ APP (logged in) ============ -->
<div id="app" class="wrap" hidden>
  <div class="apphead">
    <h1 class="brand"><span class="ball">⚽</span>Soccer Stalker</h1>
    <div class="appacts">
      <button id="syncBtn" class="synclink" aria-label="Sync now">↻ Sync</button>
      <button id="menuBtn" class="menubtn" aria-label="Menu">☰</button>
    </div>
  </div>

  <section>
    <div class="sechead">Follow a team</div>
    <div class="modetabs">
      <button class="modetab on" data-mode="gotsport">gotSport</button>
      <button class="modetab" data-mode="ecnl">ECNL</button>
    </div>

    <div id="gotsportForm">
      <div class="gsrow">
        <label class="field"><span>Gender</span>
          <select id="gsGender"><option value="">—</option><option value="f">Girls</option><option value="m">Boys</option></select></label>
        <label class="field"><span>Age group</span>
          <select id="gsAge"><option value="">—</option></select></label>
      </div>
      <label class="field"><span>Team or club name</span>
        <input id="gsQuery" type="text" placeholder="e.g. Scorpions" autocomplete="off"></label>
      <button class="primary" id="gsSearch">Search</button>
      <div id="gsResults" class="gsresults"></div>
      <details class="gsfallback">
        <summary>or paste a team link / ID</summary>
        <label class="field"><span>gotSport team link · or team ID</span>
          <input id="url" type="text" placeholder="rankings.gotsport.com/teams/781238/…" autocomplete="off"></label>
        <label class="field"><span>Nickname · optional</span>
          <input id="nick" type="text" placeholder="e.g. Ava U13" autocomplete="off"></label>
        <button class="primary" id="add">Follow team</button>
      </details>
    </div>

    <div id="ecnlForm" hidden>
      <label class="field"><span>League</span>
        <select id="ecLeague"><option value="">— select —</option></select></label>
      <label class="field"><span>Conference</span>
        <select id="ecConf" disabled><option value="">—</option></select></label>
      <label class="field"><span>Age group</span>
        <select id="ecAge" disabled><option value="">—</option></select></label>
      <label class="field" id="ecFlightWrap" hidden><span>Flight</span>
        <select id="ecFlight" disabled><option value="">—</option></select></label>
      <label class="field"><span>Team</span>
        <select id="ecTeam" disabled><option value="">—</option></select></label>
      <label class="field"><span>Nickname · optional</span>
        <input id="ecNick" type="text" placeholder="e.g. Ava ECNL" autocomplete="off"></label>
      <button class="primary" id="ecAdd" disabled>Follow team</button>
    </div>

    <div id="addMsg" class="msg"></div>
  </section>

  <section>
    <div class="sechead">Games</div>
    <div class="controls">
      <div class="seg">
        <button data-group="team">By team</button>
        <button data-group="combined">Combined</button>
      </div>
      <div class="seg">
        <button data-view="expanded">Expanded</button>
        <button data-view="compact">Compact</button>
      </div>
      <div class="chips">
        <button data-range="recent">Recent</button>
        <button data-range="upcoming">Upcoming</button>
        <button data-range="history">History</button>
      </div>
    </div>
    <div id="recentPick" class="recentpick" hidden>
      <span class="rplabel">Recent window</span>
      <span class="stepper"><button data-adj="before" data-d="-1" aria-label="less before">–</button><b id="rpBefore">2</b><span class="unit">w before</span><button data-adj="before" data-d="1" aria-label="more before">+</button></span>
      <span class="stepper"><button data-adj="after" data-d="-1" aria-label="less after">–</button><b id="rpAfter">2</b><span class="unit">w after</span><button data-adj="after" data-d="1" aria-label="more after">+</button></span>
    </div>
    <div id="teamFilter" class="teamfilter"></div>
    <div id="games"><div class="empty">Loading…</div></div>
  </section>
</div>

<!-- ============ MENU (drawer) ============ -->
<div id="backdrop" class="backdrop" hidden></div>
<aside id="menu" class="menu" hidden>
  <div class="menuhead">
    <span class="who" id="who"></span>
    <button id="menuClose" class="menux" aria-label="Close menu">×</button>
  </div>
  <div class="menuscroll">
    <section style="margin-top:22px;">
      <div class="sechead">Teams you follow</div>
      <div id="teams"><div class="empty">Loading…</div></div>
    </section>
    <button class="primary ghostbtn" id="signOut">Sign out</button>
  </div>
</aside>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.6/Sortable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function () {
  "use strict";
  const SUPABASE_URL = "https://hcepmsqsxsdhjgxguwqc.supabase.co";
  const SUPABASE_KEY = "sb_publishable_ki2jZTUn2S3uvLgPL8xCHg_mRKnc7Ie";
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const $ = (id) => document.getElementById(id);
  let user = null;
  let authMode = "signin"; // or "signup"
  let teamsCache = [];
  let editingId = null;
  let linkingId = null;                                      // team currently choosing who to link to
  let sortable = null;                                       // SortableJS instance for the team list
  let clubsMap = {};                                         // team_id -> club_name

  // ---- games view state (persisted per device) ----
  let allGames = [];
  let groupMode = "team";                                    // "team" | "combined"
  let viewMode = "expanded";                                 // "expanded" | "compact"
  let ranges = { recent: true, upcoming: false, history: false };
  let recentBefore = 2, recentAfter = 2;                     // "Recent" window, in weeks
  let hiddenTeams = new Set();                               // team_ids whose games are hidden
  function clampWk(n) { n = Math.round(Number(n)); return n < 0 ? 0 : (n > 52 ? 52 : n); }
  try {
    const saved = JSON.parse(localStorage.getItem("ss:view") || "null");
    if (saved) {
      if (saved.groupMode === "team" || saved.groupMode === "combined") groupMode = saved.groupMode;
      if (saved.viewMode === "expanded" || saved.viewMode === "compact") viewMode = saved.viewMode;
      if (saved.ranges) ranges = Object.assign(ranges, saved.ranges);
      if (Number.isFinite(saved.recentBefore)) recentBefore = clampWk(saved.recentBefore);
      if (Number.isFinite(saved.recentAfter)) recentAfter = clampWk(saved.recentAfter);
      if (Array.isArray(saved.hiddenTeams)) hiddenTeams = new Set(saved.hiddenTeams.map(String));
    }
  } catch (e) {}
  function saveView() { try { localStorage.setItem("ss:view", JSON.stringify({ groupMode, viewMode, ranges, recentBefore, recentAfter, hiddenTeams: [...hiddenTeams] })); } catch (e) {} }

  // ---------- helpers ----------
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
  function parseTeamId(input) {
    const s = (input || "").trim();
    const m = s.match(/teams\/(\d+)/);
    if (m) return m[1];
    if (/^\d{3,}$/.test(s)) return s;
    return null;
  }
  function errmsg(e) { return (e && e.message) ? e.message : String(e); }
  function friendlyError(e) {
    const m = (e && (e.message || e.error_description || e.msg)) || String(e);
    const low = String(m).toLowerCase();
    const code = e && e.code;
    if (code === "23505" || low.includes("duplicate") || low.includes("already exists")) return "You're already following this team.";
    if (low.includes("row-level security")) return "Can't save that — you may already follow this team, or need to sign back in.";
    if (low.includes("failed to fetch") || low.includes("network")) return "Network problem — check your connection and try again.";
    if (low.includes("invalid login") || low.includes("invalid credentials")) return "Wrong email or password.";
    if (low.includes("already registered") || low.includes("user already")) return "That email already has an account — try signing in instead.";
    if (low.includes("password should")) return "Password too short — use at least 6 characters.";
    if (low.includes("unable to validate email") || low.includes("invalid email")) return "That doesn't look like a valid email address.";
    if (low.includes("email not confirmed")) return "Check your email to confirm your account first.";
    return m;
  }
  function teamNick(teamId) {
    const t = teamsCache.find(x => String(x.team_id) === String(teamId));
    return t ? t.name : null;
  }
  // Prepend the club name unless it's already part of the team name.
  function withClub(teamId, name) {
    if (!name) return name || "";
    const club = clubsMap[String(teamId)];
    if (club && !name.toLowerCase().includes(club.toLowerCase())) return club + " " + name;
    return name;
  }
  async function loadClubs() {
    try {
      const { data } = await sb.from("clubs").select("team_id,club_name");
      const map = {};
      for (const c of (data || [])) if (c.club_name) map[String(c.team_id)] = c.club_name;
      clubsMap = map;
    } catch (e) { clubsMap = {}; }   // table may not exist yet — degrade gracefully
  }

  // ---- team grouping (linked teams shown as one) ----------------------------
  // A team's group key = its group_id, or its own team_id when unlinked. Linked
  // teams all carry group_id = the primary team's team_id, so the primary is the
  // member whose team_id equals the key. Everything (games, filter, record)
  // groups by this key, so two follows for one real team read as one.
  function groupKeyOf(t) {
    if (t && typeof t === "object") return String(t.group_id || t.team_id);
    const row = teamsCache.find(x => String(x.team_id) === String(t));
    return row ? String(row.group_id || row.team_id) : String(t);
  }
  function groupMembers(key) { return teamsCache.filter(x => groupKeyOf(x) === String(key)); }
  function groupPrimary(key) {
    const members = groupMembers(key);
    return members.find(x => String(x.team_id) === String(key)) || members[0] || null;
  }
  function teamGroups() {   // ordered, deduped groups following teamsCache order
    const seen = new Set(), out = [];
    for (const t of teamsCache) {
      const k = groupKeyOf(t);
      if (seen.has(k)) continue;
      seen.add(k);
      out.push({ key: k, primary: groupPrimary(k), members: groupMembers(k) });
    }
    return out;
  }
  function groupLabel(key) {
    const p = groupPrimary(key);
    return (p && p.name) || ("Team " + key);
  }
  function isLinked(key) { return groupMembers(key).length > 1; }
  function groupRecord(ids) {
    const set = new Set(ids.map(String));
    let w = 0, l = 0, t = 0;
    for (const g of allGames) {
      if (!set.has(String(g.team_id)) || isPlaceholder(g)) continue;
      if (g.team_score == null || g.opponent_score == null) continue;
      if (g.team_score > g.opponent_score) w++;
      else if (g.team_score < g.opponent_score) l++;
      else t++;
    }
    return { w, l, t };
  }

  // ---------- auth UI ----------
  function renderAuthMode() {
    const signup = authMode === "signup";
    $("authTitle").textContent = signup ? "Create account" : "Sign in";
    $("authBtn").textContent = signup ? "Create account" : "Sign in";
    $("toggleText").textContent = signup ? "Already have an account?" : "No account yet?";
    $("toggleMode").textContent = signup ? "Sign in" : "Create one";
    $("password").setAttribute("autocomplete", signup ? "new-password" : "current-password");
    $("authMsg").textContent = "";
    $("authMsg").className = "msg";
  }

  async function doAuth() {
    const email = $("email").value.trim();
    const password = $("password").value;
    const msg = $("authMsg");
    msg.className = "msg";
    if (!email || !password) { msg.className = "msg err"; msg.textContent = "Enter an email and password."; return; }
    $("authBtn").disabled = true;
    try {
      if (authMode === "signup") {
        const { data, error } = await sb.auth.signUp({ email, password });
        if (error) throw error;
        if (data.session) {
          // logged straight in (email confirmation is off)
        } else {
          msg.className = "msg ok";
          msg.textContent = "Check your email to confirm your account, then sign in.";
        }
      } else {
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if (error) throw error;
      }
    } catch (e) {
      msg.className = "msg err";
      msg.textContent = friendlyError(e);
    } finally {
      $("authBtn").disabled = false;
    }
  }

  // ---------- session -> screen ----------
  function showLoggedOut() {
    user = null;
    $("app").hidden = true;
    $("auth").hidden = false;
    $("menu").hidden = true;
    $("backdrop").hidden = true;
  }
  function showLoggedIn(u) {
    user = u;
    $("auth").hidden = true;
    $("app").hidden = false;
    $("who").textContent = u.email;
    loadTeams();
    loadClubs().then(loadGames);
  }

  // ---------- data ----------
  async function addTeam() {
    const msg = $("addMsg");
    msg.className = "msg"; msg.textContent = "";
    const teamId = parseTeamId($("url").value);
    if (!teamId) {
      msg.className = "msg err";
      msg.textContent = "Couldn't find a team ID in that. Paste a link like rankings.gotsport.com/teams/781238/… or just the number.";
      return;
    }
    const dup = teamsCache.find(t => String(t.team_id) === String(teamId));
    if (dup) {
      msg.className = "msg err";
      msg.textContent = "You're already following this team (" + dup.name + "). Rename it in the menu (☰).";
      return;
    }
    const nick = $("nick").value.trim();
    $("add").disabled = true;
    try {
      const { error } = await sb.from("followed_teams")
        .insert({ team_id: teamId, name: nick || ("Team " + teamId), user_id: user.id });
      if (error) throw error;
      msg.className = "msg ok";
      msg.textContent = "Following team " + teamId + " — details & games fill in on the next sync.";
      $("url").value = ""; $("nick").value = "";
      loadTeams(); loadGames();
    } catch (e) {
      msg.className = "msg err";
      msg.textContent = friendlyError(e);
    } finally {
      $("add").disabled = false;
    }
  }

  async function removeTeam(teamId, name) {
    if (!confirm("Stop following " + name + "?")) return;
    try {
      const { error } = await sb.from("followed_teams").delete()
        .eq("team_id", teamId).eq("user_id", user.id);
      if (error) throw error;
      // if this team was a link primary, free its members so they don't orphan
      await sb.from("followed_teams").update({ group_id: null })
        .eq("group_id", String(teamId)).eq("user_id", user.id);
      loadTeams(); loadGames();
    } catch (e) {
      alert(friendlyError(e));
    }
  }

  function crest(logo) {
    if (logo) return '<img class="crest" src="' + logo + '" alt="" onerror="this.replaceWith(Object.assign(document.createElement(\'div\'),{className:\'crest\',textContent:\'⚽\'}))">';
    return '<div class="crest">⚽</div>';
  }

  async function loadTeams() {
    let res = await sb.from("followed_teams").select("*")
      .order("position", { ascending: true, nullsFirst: false })
      .order("created_at", { ascending: true });
    if (res.error) {   // `position` column may not exist yet — fall back
      res = await sb.from("followed_teams").select("*").order("created_at", { ascending: true });
    }
    if (res.error) { $("teams").innerHTML = '<div class="empty">' + escapeHtml(friendlyError(res.error)) + '</div>'; return; }
    teamsCache = res.data || [];
    renderTeams();
    renderTeamFilter();
  }

  async function saveTeamOrder() {
    const ids = [...$("teams").querySelectorAll(".team")].map(r => r.dataset.id).filter(Boolean);
    teamsCache.sort((a, b) => ids.indexOf(String(a.team_id)) - ids.indexOf(String(b.team_id)));
    renderTeamFilter();
    renderGames();
    try {
      await Promise.all(ids.map((id, i) =>
        sb.from("followed_teams").update({ position: i }).eq("team_id", id).eq("user_id", user.id)));
    } catch (e) { /* order still applied locally */ }
  }

  let tfOpen = false;
  function tfLabel() {
    const groups = teamGroups();
    const total = groups.length;
    const shown = groups.filter(gr => !hiddenTeams.has(gr.key)).length;
    return shown === total ? ("All " + total + " teams") : (shown + " of " + total + " shown");
  }
  function updateTfLabel() {
    const b = $("tfBtn"); if (!b) return;
    b.innerHTML = '<span class="tflabel">Show</span> ' + escapeHtml(tfLabel()) + ' <span class="tfcaret">▾</span>';
  }
  function renderTeamFilter() {
    const el = $("teamFilter");
    if (!teamsCache.length) { el.innerHTML = ""; tfOpen = false; return; }
    const groups = teamGroups();
    const showSearch = groups.length > 8;
    el.innerHTML =
      '<button class="tfbtn" id="tfBtn" aria-expanded="' + tfOpen + '"><span class="tflabel">Show</span> '
        + escapeHtml(tfLabel()) + ' <span class="tfcaret">▾</span></button>'
      + '<div class="tfpanel" id="tfPanel"' + (tfOpen ? '' : ' hidden') + '>'
        + (showSearch ? '<input class="tfsearch" id="tfSearch" type="text" placeholder="Filter teams…" autocomplete="off">' : '')
        + '<div class="tfquick"><button data-tfq="all">Select all</button><button data-tfq="none">Clear</button></div>'
        + '<div class="tflist">'
        + groups.map(gr => {
            const id = gr.key;
            const name = groupLabel(id);
            const on = !hiddenTeams.has(id);
            return '<label class="tfopt" data-name="' + escapeHtml(name.toLowerCase()) + '">'
              + '<input type="checkbox" data-team="' + escapeHtml(id) + '"' + (on ? ' checked' : '') + '>'
              + '<span>' + escapeHtml(name) + '</span></label>';
          }).join("")
        + '</div></div>';

    $("tfBtn").addEventListener("click", (e) => { e.stopPropagation(); tfOpen = !tfOpen; renderTeamFilter(); });
    const panel = $("tfPanel");
    if (!panel) return;
    panel.addEventListener("click", e => e.stopPropagation());   // clicks inside keep it open
    panel.querySelectorAll("input[data-team]").forEach(cb => cb.addEventListener("change", () => {
      const id = String(cb.dataset.team);
      if (cb.checked) hiddenTeams.delete(id); else hiddenTeams.add(id);
      saveView(); renderGames(); updateTfLabel();
    }));
    panel.querySelectorAll("[data-tfq]").forEach(b => b.addEventListener("click", () => {
      if (b.dataset.tfq === "all") hiddenTeams.clear();
      else teamGroups().forEach(gr => hiddenTeams.add(gr.key));
      saveView(); renderGames();
      panel.querySelectorAll("input[data-team]").forEach(cb => cb.checked = !hiddenTeams.has(String(cb.dataset.team)));
      updateTfLabel();
    }));
    const s = $("tfSearch");
    if (s) {
      s.addEventListener("input", () => {
        const q = s.value.trim().toLowerCase();
        panel.querySelectorAll(".tfopt").forEach(o => o.classList.toggle("nomatch", !!q && !o.dataset.name.includes(q)));
      });
      if (tfOpen) s.focus();
    }
  }

  function renderTeams() {
    const el = $("teams");
    if (!teamsCache.length) { el.innerHTML = '<div class="empty">No teams yet.<br>Add one from the main screen.</div>'; return; }
    el.innerHTML = teamsCache.map(t => {
      const id = escapeHtml(t.team_id);
      if (t.team_id === editingId) {
        return '<div class="team" data-id="' + id + '">' + crest(t.logo)
          + '<input class="editin" type="text" value="' + escapeHtml(t.name) + '" data-editinput>'
          + '<button class="mini" data-save="' + id + '">Save</button>'
          + '<button class="mini cancel" data-cancel="1">Cancel</button></div>';
      }
      if (t.team_id === linkingId) {
        // choose which other team this one is the same as (that team becomes primary)
        const myKey = groupKeyOf(t);
        const opts = teamGroups().filter(gr => gr.key !== myKey)
          .map(gr => '<option value="' + escapeHtml(gr.key) + '">' + escapeHtml(groupLabel(gr.key)) + '</option>').join("");
        return '<div class="team" data-id="' + id + '">' + crest(t.logo)
          + '<div class="info"><div class="name">' + escapeHtml(t.name) + '</div>'
          + '<select class="editin linksel" data-linksel>'
          + '<option value="">— same team as… —</option>' + opts + '</select></div>'
          + '<button class="mini" data-linksave="' + id + '">Link</button>'
          + '<button class="mini cancel" data-linkcancel="1">Cancel</button></div>';
      }
      const key = groupKeyOf(t);
      const linked = isLinked(key);
      const isPrimary = String(t.team_id) === key;
      const sub = linked
        ? (isPrimary ? 'Linked · ' + (groupMembers(key).length) + ' teams'
                     : '↳ linked to ' + escapeHtml(groupLabel(key)))
        : 'ID ' + id;
      return '<div class="team" data-id="' + id + '">'
        + '<span class="drag" title="Drag to reorder">⠿</span>' + crest(t.logo)
        + '<div class="info"><div class="name">' + escapeHtml(t.name) + '</div><div class="tid">' + sub + '</div></div>'
        + '<button class="mini" data-edit="' + id + '">Rename</button>'
        + (linked
            ? '<button class="mini" data-unlink="' + escapeHtml(key) + '">Unlink</button>'
            : '<button class="mini" data-link="' + id + '">Link</button>')
        + '<button class="xbtn" data-team="' + id + '" data-name="' + escapeHtml(t.name) + '">Unfollow</button></div>';
    }).join("");
    if (sortable) { sortable.destroy(); sortable = null; }
    if (window.Sortable && !editingId && teamsCache.length > 1) {
      sortable = window.Sortable.create(el, { handle: ".drag", animation: 150, onEnd: saveTeamOrder });
    }
    el.querySelectorAll("[data-edit]").forEach(b => b.addEventListener("click", () => {
      editingId = b.dataset.edit; renderTeams();
      const inp = el.querySelector("[data-editinput]"); if (inp) { inp.focus(); inp.select(); }
    }));
    el.querySelectorAll("[data-cancel]").forEach(b => b.addEventListener("click", () => { editingId = null; renderTeams(); }));
    el.querySelectorAll("[data-save]").forEach(b => b.addEventListener("click", () => saveTeamName(b.dataset.save)));
    el.querySelectorAll("[data-editinput]").forEach(inp => inp.addEventListener("keydown", e => {
      if (e.key === "Enter") saveTeamName(editingId);
      else if (e.key === "Escape") { editingId = null; renderTeams(); }
    }));
    el.querySelectorAll("button[data-team]").forEach(b => b.addEventListener("click", () => removeTeam(b.dataset.team, b.dataset.name)));
    el.querySelectorAll("[data-link]").forEach(b => b.addEventListener("click", () => { linkingId = b.dataset.link; editingId = null; renderTeams(); }));
    el.querySelectorAll("[data-linkcancel]").forEach(b => b.addEventListener("click", () => { linkingId = null; renderTeams(); }));
    el.querySelectorAll("[data-linksave]").forEach(b => b.addEventListener("click", () => {
      const sel = el.querySelector("[data-linksel]");
      const target = sel ? sel.value : "";
      if (!target) { if (sel) sel.focus(); return; }
      linkTeams(b.dataset.linksave, target);
    }));
    el.querySelectorAll("[data-unlink]").forEach(b => b.addEventListener("click", () => unlinkGroup(b.dataset.unlink)));
  }

  // Merge source's whole group into targetKey's group (target's primary wins).
  async function linkTeams(sourceId, targetKey) {
    const srcKey = groupKeyOf(sourceId);
    if (String(srcKey) === String(targetKey)) { linkingId = null; renderTeams(); return; }
    const movers = groupMembers(srcKey);
    try {
      const results = await Promise.all(movers.map(m =>
        sb.from("followed_teams").update({ group_id: String(targetKey) })
          .eq("team_id", m.team_id).eq("user_id", user.id).select()));
      const changed = results.reduce((n, r) => n + ((r.data && r.data.length) || 0), 0);
      if (!changed) {
        alert("Couldn't link — Supabase is blocking the update (the \"own teams update\" policy is missing). Run that SQL, then try again.");
        return;
      }
      linkingId = null;
      await loadTeams();
      loadGames();
    } catch (e) { alert(friendlyError(e)); }
  }

  async function unlinkGroup(key) {
    const members = groupMembers(key);
    if (members.length < 2) return;
    if (!confirm("Unlink these " + members.length + " teams? They'll show separately again.")) return;
    try {
      await Promise.all(members.map(m =>
        sb.from("followed_teams").update({ group_id: null })
          .eq("team_id", m.team_id).eq("user_id", user.id)));
      await loadTeams();
      loadGames();
    } catch (e) { alert(friendlyError(e)); }
  }

  async function saveTeamName(teamId) {
    const inp = $("teams").querySelector("[data-editinput]");
    const newName = inp ? inp.value.trim() : "";
    if (!newName) { if (inp) inp.focus(); return; }
    try {
      const { data, error } = await sb.from("followed_teams").update({ name: newName })
        .eq("team_id", teamId).eq("user_id", user.id).select();
      if (error) throw error;
      if (!data || !data.length) {
        alert("Couldn't save the name — Supabase is blocking the update (the \"own teams update\" policy is missing). Run that SQL, then try again.");
        return;
      }
      editingId = null;
      await loadTeams();
      loadGames();
    } catch (e) { alert(friendlyError(e)); }
  }

  function fmtWhen(g) {
    if (!g.match_time) return g.match_date || "Time TBD";
    const d = new Date(g.match_time);
    return d.toLocaleString([], { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
  }
  function resultCls(g) {
    if (g.team_score == null || g.opponent_score == null) return "";
    if (g.team_score > g.opponent_score) return "win";
    if (g.team_score < g.opponent_score) return "loss";
    return "draw";
  }
  // Link each game back to the gotSport page the score came from.
  function gameUrl(g) {
    if (g.event_id) return "https://system.gotsport.com/org_event/events/" + g.event_id + "/schedules";
    return "https://rankings.gotsport.com/teams/" + encodeURIComponent(g.team_id);
  }
  function sideLine(side, rcls) {
    const sc = side.score == null ? "" : side.score;
    return '<div class="tline' + (side.mine ? " mine" : "") + '">'
      + '<span class="tside">' + crest(side.logo)
      + '<span class="tn">' + escapeHtml(side.name || "TBD") + '</span></span>'
      + '<span class="tsc ' + (side.mine ? rcls : "") + '">' + sc + '</span></div>';
  }

  // ---- compact (dense table) view ----
  function teamRecord(teamId) {
    let w = 0, l = 0, t = 0;
    for (const g of allGames) {
      if (String(g.team_id) !== String(teamId) || isPlaceholder(g)) continue;
      if (g.team_score == null || g.opponent_score == null) continue;
      if (g.team_score > g.opponent_score) w++;
      else if (g.team_score < g.opponent_score) l++;
      else t++;
    }
    return { w, l, t };
  }
  function cDate(g) {
    const d = gameDate(g);
    return d ? d.toLocaleDateString([], { weekday: "short", month: "short", day: "numeric" }) : "TBD";
  }
  function cTime(g) {
    if (!g.match_time) return "";
    const d = new Date(g.match_time);
    return isNaN(d) ? "" : d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit", timeZoneName: "short" });
  }
  function cResult(g) {
    if (g.team_score == null || g.opponent_score == null) return { txt: "–", cls: "" };
    const cls = resultCls(g), letter = cls === "win" ? "W" : cls === "loss" ? "L" : "D";
    return { txt: letter + " " + g.team_score + "-" + g.opponent_score, cls };
  }
  function compactRow(g, withTeam) {
    const r = cResult(g);
    const teamCell = withTeam
      ? '<div class="c-team">' + (g.team_logo ? '<img src="' + g.team_logo + '" alt="">' : "")
        + escapeHtml(teamNick(g.team_id) || withClub(g.team_id, g.team_name) || "") + '</div>'
      : "";
    const div = g.division_name ? '<div class="cdiv">' + escapeHtml(g.division_name) + '</div>' : "";
    return '<tr class="crow" data-url="' + escapeHtml(gameUrl(g)) + '">'
      + '<td><span class="c-date">' + escapeHtml(cDate(g)) + '</span>'
        + (cTime(g) ? '<div class="c-time">' + escapeHtml(cTime(g)) + '</div>' : "") + '</td>'
      + '<td>' + teamCell + '<div class="c-opp">' + escapeHtml(withClub(g.opponent_id, g.opponent_name) || "TBD") + '</div></td>'
      + '<td class="c-res ' + r.cls + '">' + escapeHtml(r.txt) + '</td>'
      + '<td class="c-event">' + escapeHtml(g.event_name || "") + div + '</td>'
      + '</tr>';
  }
  function compactTable(games, withTeam) {
    return '<table class="ctable"><thead><tr>'
      + '<th>Date</th><th>' + (withTeam ? "Team · Opponent" : "Opponent") + '</th><th style="text-align:right">Result</th><th>Event</th>'
      + '</tr></thead><tbody>'
      + games.map(g => compactRow(g, withTeam)).join("")
      + '</tbody></table>';
  }

  // ---- date/range filtering ----
  function gameDate(g) {
    if (g.match_time) { const d = new Date(g.match_time); return isNaN(d) ? null : d; }
    if (g.match_date) { const d = new Date(g.match_date + "T12:00:00"); return isNaN(d) ? null : d; }
    return null;
  }
  function anyRange() { return ranges.recent || ranges.upcoming || ranges.history; }
  // TBD-bracket placeholders list a team against itself — hide them.
  function isPlaceholder(g) {
    return (g.opponent_id != null && String(g.opponent_id) === String(g.team_id))
        || (!!g.opponent_name && !!g.team_name && g.opponent_name === g.team_name);
  }
  function inRanges(g) {
    if (ranges.history) return true;                          // history = everything
    const d = gameDate(g), now = new Date();
    if (ranges.upcoming) {                                     // upcoming = every future game (TBD counts)
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      if (!d || d >= today) return true;
    }
    if (ranges.recent && d) {                                  // recent = within the chosen weeks window
      const ms = d.getTime() - now.getTime();
      if (ms <= recentAfter * 7 * 86400000 && ms >= -recentBefore * 7 * 86400000) return true;
    }
    return false;
  }

  function gameRow(g) {
    const mine = { name: teamNick(g.team_id) || withClub(g.team_id, g.team_name), logo: g.team_logo, score: g.team_score, mine: true };
    const opp = { name: withClub(g.opponent_id, g.opponent_name), logo: g.opponent_logo, score: g.opponent_score, mine: false };
    const rcls = resultCls(g);
    const meta = escapeHtml(fmtWhen(g))
      + (g.field_name ? " · " + escapeHtml(g.field_name) : "")
      + (g.venue_name ? " · " + escapeHtml(g.venue_name) : "");
    return '<a class="game" href="' + gameUrl(g) + '" target="_blank" rel="noopener">'
      + (g.event_name ? '<div class="gevent">' + escapeHtml(g.event_name) + '</div>' : "")
      + '<div class="scard">' + sideLine(mine, rcls) + sideLine(opp, rcls) + '</div>'
      + '<div class="when">' + meta + '</div></a>';
  }

  function renderGames() {
    const el = $("games");
    if (!allGames.length) { el.innerHTML = '<div class="empty">No games synced yet.<br>They appear after the next background sync.</div>'; return; }
    if (!anyRange()) { el.innerHTML = '<div class="empty">Pick a filter — recent, upcoming, or history.</div>'; return; }
    const list = allGames.filter(g => !isPlaceholder(g) && !hiddenTeams.has(groupKeyOf(g.team_id)) && inRanges(g)).sort((a, b) => {
      const da = gameDate(a), db = gameDate(b);
      if (!da && !db) return 0; if (!da) return 1; if (!db) return -1;
      return da - db;
    });
    if (!list.length) { el.innerHTML = '<div class="empty">No games in this range.</div>'; return; }
    const compact = viewMode === "compact";
    if (groupMode === "combined") {
      el.innerHTML = compact ? compactTable(list, true) : list.map(g => gameRow(g)).join("");
    } else {
      // group by LINKED-team key, so two follows for one real team merge into one
      const byGroup = {};
      for (const g of list) (byGroup[groupKeyOf(g.team_id)] ||= []).push(g);
      const order = teamGroups().map(gr => gr.key);
      const entries = Object.entries(byGroup).sort((a, b) => {
        const ia = order.indexOf(a[0]), ib = order.indexOf(b[0]);
        return (ia < 0 ? 999 : ia) - (ib < 0 ? 999 : ib);
      });
      el.innerHTML = entries.map(([key, gs]) => {
        const primary = groupPrimary(key);
        const pid = primary ? primary.team_id : key;
        const label = (primary && primary.name) || withClub(pid, gs[0].team_name) || ("Team " + key);
        const logo = (primary && primary.logo) || (gs.find(x => x.team_logo) || {}).team_logo || gs[0].team_logo;
        let head = '<div class="grouphd">' + (logo ? '<img src="' + logo + '" alt="">' : "");
        if (compact) {
          const memberIds = groupMembers(key).map(m => String(m.team_id));
          const rec = groupRecord(memberIds.length ? memberIds : [key]);
          const recTxt = (rec.w + rec.l + rec.t) ? ("Record: " + rec.w + "W-" + rec.l + "L-" + rec.t + "T") : "";
          head += '<div class="ghinfo"><span class="gname">' + escapeHtml(label) + '</span>'
            + (recTxt ? '<span class="grec">' + recTxt + '</span>' : "") + '</div>';
        } else {
          head += '<span class="gname">' + escapeHtml(label) + '</span>';
        }
        head += '</div>';
        return '<div class="teamgroup">' + head
          + (compact ? compactTable(gs, false) : gs.map(g => gameRow(g)).join("")) + '</div>';
      }).join("");
    }
  }

  function syncControls() {
    document.querySelectorAll(".seg button").forEach(b => {
      if (b.dataset.group) b.classList.toggle("on", b.dataset.group === groupMode);
      if (b.dataset.view) b.classList.toggle("on", b.dataset.view === viewMode);
    });
    document.querySelectorAll(".chips button").forEach(b => b.classList.toggle("on", !!ranges[b.dataset.range]));
    $("recentPick").hidden = !ranges.recent;
    $("rpBefore").textContent = recentBefore;
    $("rpAfter").textContent = recentAfter;
  }

  async function loadGames() {
    const el = $("games");
    const { data: teams } = await sb.from("followed_teams").select("team_id");
    const ids = (teams || []).map(t => t.team_id);
    if (!ids.length) { allGames = []; el.innerHTML = '<div class="empty">Follow a team to see its games.</div>'; return; }
    const { data: games, error } = await sb.from("games").select("*").in("team_id", ids);
    if (error) { el.innerHTML = '<div class="empty">Error: ' + escapeHtml(errmsg(error)) + '</div>'; return; }
    allGames = games || [];
    renderGames();
  }

  // ---------- wire up ----------
  // ---------- ECNL picker (cascading, fed by the meta-ecnl proxy) ----------
  const ecState = { leagues: [], org: null, season: null, hasFlights: false, conf: null, teams: [] };
  function ecMsg(t, err) { const m = $("addMsg"); m.className = "msg" + (err ? " err" : (t ? " ok" : "")); m.textContent = t; }
  async function metaFetch(action, params) {
    const { data: { session } } = await sb.auth.getSession();
    const u = new URL(SUPABASE_URL + "/functions/v1/meta-ecnl");
    u.searchParams.set("action", action);
    for (const k in (params || {})) u.searchParams.set(k, params[k]);
    const r = await fetch(u, { headers: { apikey: SUPABASE_KEY, Authorization: "Bearer " + (session ? session.access_token : "") } });
    const d = await r.json();
    if (!r.ok || d.error) throw new Error(d.error || ("meta " + action + " " + r.status));
    return d;
  }
  function setOptions(sel, items, placeholder) {
    sel.innerHTML = '<option value="">' + escapeHtml(placeholder) + '</option>' +
      items.map(i => '<option value="' + escapeHtml(i.id) + '">' + escapeHtml(i.name) + '</option>').join("");
    sel.disabled = !items.length;
  }
  function resetEc(from) {
    const order = ["Conf", "Age", "Flight", "Team"];
    const idx = order.indexOf(from);
    for (const k of order.slice(idx)) {
      const sel = $("ec" + k); if (sel) { sel.innerHTML = '<option value="">—</option>'; sel.disabled = true; }
    }
    if (idx <= order.indexOf("Flight")) $("ecFlightWrap").hidden = true;  // only hide when the flight step itself is reset
    $("ecAdd").disabled = true;
  }
  async function ecLoadLeagues() {
    if ($("ecLeague").options.length > 1) return;
    try { const d = await metaFetch("leagues"); ecState.leagues = d.leagues;
      setOptions($("ecLeague"), d.leagues.map(l => ({ id: l.key, name: l.name })), "— select —"); }
    catch (e) { ecMsg(errmsg(e), true); }
  }
  async function ecLoadTeams(div) {
    setOptions($("ecTeam"), [], "loading teams…");
    try {
      const d = await metaFetch("teams", { org: ecState.org, season: ecState.season, conf: ecState.conf, div });
      ecState.teams = d.teams || [];
      setOptions($("ecTeam"), ecState.teams.map(t => ({ id: t.teamId, name: t.name })),
        ecState.teams.length ? "— select team —" : "no teams found");
      ecMsg("", false);
    } catch (e) { ecMsg(errmsg(e), true); }
  }
  async function followEcnl() {
    const t = ecState.teams.find(x => x.teamId === $("ecTeam").value);
    if (!t) return;
    $("ecAdd").disabled = true;
    try {
      const nick = $("ecNick").value.trim() || t.name;
      const { error } = await sb.from("followed_teams").insert({
        team_id: "ecnl-" + t.teamId, name: nick, user_id: user.id, source: "ecnl",
        ecnl_org: ecState.org, ecnl_conf: Number(ecState.conf), ecnl_club: Number(t.clubId), ecnl_team: Number(t.teamId)
      });
      if (error) throw error;
      ecMsg("Following " + t.name + " — games appear on the next sync.", false);
      $("ecNick").value = "";
      loadTeams(); loadClubs().then(loadGames);
    } catch (e) { ecMsg(friendlyError(e), true); $("ecAdd").disabled = false; }
  }
  document.querySelectorAll(".modetab").forEach(b => b.addEventListener("click", () => {
    document.querySelectorAll(".modetab").forEach(x => x.classList.toggle("on", x === b));
    const ecnl = b.dataset.mode === "ecnl";
    $("gotsportForm").hidden = ecnl; $("ecnlForm").hidden = !ecnl; ecMsg("", false);
    if (ecnl) ecLoadLeagues();
  }));
  $("ecLeague").addEventListener("change", () => {
    resetEc("Conf"); const lg = ecState.leagues.find(l => l.key === $("ecLeague").value);
    if (!lg) return; ecState.org = lg.org; ecState.season = lg.season; ecState.hasFlights = lg.hasFlights;
    metaFetch("conferences", { season: lg.season }).then(d => setOptions($("ecConf"), d.conferences, "— select —")).catch(e => ecMsg(errmsg(e), true));
  });
  $("ecConf").addEventListener("change", () => {
    resetEc("Age"); const conf = $("ecConf").value; if (!conf) return; ecState.conf = conf;
    metaFetch("ages", { org: ecState.org, conf }).then(d => setOptions($("ecAge"), d.ages, "— select —")).catch(e => ecMsg(errmsg(e), true));
  });
  $("ecAge").addEventListener("change", () => {
    resetEc("Flight"); const age = $("ecAge").value; if (!age) return;
    if (!ecState.hasFlights) { ecLoadTeams(age); return; }   // div = age for ECNL (no flights)
    // Pre-ECNL / RL: flights vary by age — only show the step if this age actually has flights.
    metaFetch("flights", { org: ecState.org, conf: ecState.conf, age }).then(d => {
      if (d.flights && d.flights.length) {
        $("ecFlightWrap").hidden = false;
        setOptions($("ecFlight"), d.flights, "— select —");
      } else {
        $("ecFlightWrap").hidden = true;
        ecLoadTeams(age);                                     // no flights at this age → div = age
      }
    }).catch(e => ecMsg(errmsg(e), true));
  });
  $("ecFlight").addEventListener("change", () => { resetEc("Team"); const f = $("ecFlight").value; if (f) ecLoadTeams(f); });
  $("ecTeam").addEventListener("change", () => { $("ecAdd").disabled = !$("ecTeam").value; });
  $("ecAdd").addEventListener("click", followEcnl);

  $("authBtn").addEventListener("click", doAuth);
  $("password").addEventListener("keydown", e => { if (e.key === "Enter") doAuth(); });
  $("email").addEventListener("keydown", e => { if (e.key === "Enter") doAuth(); });
  $("toggleMode").addEventListener("click", () => { authMode = authMode === "signin" ? "signup" : "signin"; renderAuthMode(); });
  $("signOut").addEventListener("click", () => sb.auth.signOut());
  $("add").addEventListener("click", addTeam);
  $("url").addEventListener("keydown", e => { if (e.key === "Enter") addTeam(); });
  $("nick").addEventListener("keydown", e => { if (e.key === "Enter") addTeam(); });

  // ---------- gotSport name search (fed by the meta-ecnl proxy) ----------
  (function fillGsAges() {
    let html = '<option value="">—</option>';
    for (let a = 8; a <= 19; a++) html += '<option value="' + a + '">U' + a + '</option>';
    $("gsAge").innerHTML = html;
  })();
  let gsResults = [];
  async function gsSearch() {
    const msg = $("addMsg"); msg.className = "msg"; msg.textContent = "";
    const gender = $("gsGender").value, age = $("gsAge").value, q = $("gsQuery").value.trim();
    if (!gender || !age) { msg.className = "msg err"; msg.textContent = "Pick a gender and age group first."; return; }
    if (!q) { msg.className = "msg err"; msg.textContent = "Type a team or club name to search."; return; }
    $("gsResults").innerHTML = '<div class="gshint">Searching…</div>';
    $("gsSearch").disabled = true;
    try {
      const d = await metaFetch("gotsport-search", { q, gender, age });
      gsResults = d.teams || [];
      renderGsResults(d.pagination);
    } catch (e) { $("gsResults").innerHTML = ""; msg.className = "msg err"; msg.textContent = errmsg(e); }
    finally { $("gsSearch").disabled = false; }
  }
  function renderGsResults(pg) {
    const el = $("gsResults");
    if (!gsResults.length) { el.innerHTML = '<div class="gshint">No teams found — try a different spelling.</div>'; return; }
    let html = gsResults.map((t, i) => {
      const following = teamsCache.some(x => String(x.team_id) === String(t.teamId));
      const meta = [t.clubName, t.state].filter(Boolean).join(" · ");
      return '<button class="gsitem" data-i="' + i + '"' + (following ? ' disabled' : '') + '>'
        + crest(t.logo)
        + '<div class="info"><div class="gn">' + escapeHtml(t.name) + '</div>'
        + (meta ? '<div class="gm">' + escapeHtml(meta) + '</div>' : '') + '</div>'
        + '<span class="plus">' + (following ? 'following' : '+ follow') + '</span></button>';
    }).join("");
    const total = pg && pg.total_count;
    if (total && total > gsResults.length) html += '<div class="gshint">Showing ' + gsResults.length + ' of ' + total + ' — refine the name to narrow it down.</div>';
    el.innerHTML = html;
    el.querySelectorAll(".gsitem").forEach(b => b.addEventListener("click", () => followGotsport(gsResults[+b.dataset.i])));
  }
  async function followGotsport(t) {
    if (!t) return;
    const msg = $("addMsg"); msg.className = "msg"; msg.textContent = "";
    if (teamsCache.some(x => String(x.team_id) === String(t.teamId))) {
      msg.className = "msg err"; msg.textContent = "You already follow that team."; return;
    }
    try {
      const { error } = await sb.from("followed_teams")
        .insert({ team_id: String(t.teamId), name: t.name, user_id: user.id, source: "gotsport" });
      if (error) throw error;
      msg.className = "msg ok"; msg.textContent = "Following " + t.name + " — games fill in on the next sync.";
      await loadTeams(); renderGsResults(); loadGames();
    } catch (e) { msg.className = "msg err"; msg.textContent = friendlyError(e); }
  }
  $("gsSearch").addEventListener("click", gsSearch);
  $("gsQuery").addEventListener("keydown", e => { if (e.key === "Enter") gsSearch(); });

  // close the team-filter dropdown on any outside click
  document.addEventListener("click", () => {
    if (!tfOpen) return;
    tfOpen = false;
    const p = $("tfPanel"); if (p) p.hidden = true;
    const b = $("tfBtn"); if (b) b.setAttribute("aria-expanded", "false");
  });

  // drawer menu
  function closeMenu() { $("menu").hidden = true; $("backdrop").hidden = true; editingId = null; renderTeams(); }
  $("menuBtn").addEventListener("click", () => { $("menu").hidden = false; $("backdrop").hidden = false; });
  $("menuClose").addEventListener("click", closeMenu);
  $("backdrop").addEventListener("click", closeMenu);

  // sync now — for now this refreshes from the database; once the poller (backend)
  // exists we'll first trigger the gotSport pull here, then reload.
  async function syncNow() {
    const b = $("syncBtn"); const orig = b.textContent;
    b.disabled = true; b.textContent = "↻ Syncing…";
    let live = false;
    try {
      const { error } = await sb.functions.invoke("sync", { method: "POST" });
      if (!error) live = true;                 // real gotSport pull succeeded
    } catch (e) { /* sync function not deployed yet — fall back to a refresh */ }
    try { await loadTeams(); await loadClubs(); await loadGames(); } catch (e) {}
    b.textContent = live ? "✓ Synced" : "↻ Refreshed";
    setTimeout(() => { b.textContent = orig; b.disabled = false; }, 1500);
  }
  $("syncBtn").addEventListener("click", syncNow);

  document.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => {
    if (b.dataset.group) groupMode = b.dataset.group;
    if (b.dataset.view) viewMode = b.dataset.view;
    saveView(); syncControls(); renderGames();
  }));
  // open a compact-table row's source page
  $("games").addEventListener("click", e => {
    const tr = e.target.closest(".crow[data-url]");
    if (tr) window.open(tr.dataset.url, "_blank", "noopener");
  });
  document.querySelectorAll(".chips button").forEach(b => b.addEventListener("click", () => {
    ranges[b.dataset.range] = !ranges[b.dataset.range]; saveView(); syncControls(); renderGames();
  }));
  document.querySelectorAll("#recentPick button").forEach(b => b.addEventListener("click", () => {
    const d = parseInt(b.dataset.d, 10);
    if (b.dataset.adj === "before") recentBefore = clampWk(recentBefore + d);
    else recentAfter = clampWk(recentAfter + d);
    saveView(); syncControls(); renderGames();
  }));
  syncControls();

  renderAuthMode();
  sb.auth.onAuthStateChange((_e, session) => {
    if (session && session.user) showLoggedIn(session.user);
    else showLoggedOut();
  });
  sb.auth.getSession().then(({ data }) => {
    if (data.session && data.session.user) showLoggedIn(data.session.user);
    else showLoggedOut();
  });
})();
</script>
</body>
</html>
